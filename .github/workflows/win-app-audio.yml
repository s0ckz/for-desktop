name: Windows per-app audio build

# Builds the Windows app with the native per-process audio capture module and
# uploads the installer, so the addon never has to be compiled by hand.

on:
  push:
    branches:
      # main is the trunk now; the old feature branch is frozen but still
      # builds so anything left on it is not silently dropped.
      - main
      - fix/capture-and-shell-stability
      - feat/windows-per-app-audio
  workflow_dispatch:

# Every run publishes to the same fixed release tag, and the workflow now fires
# from more than one branch. Without this, two pushes land on the same assets at
# once and whichever finishes last wins -- possibly with the other's installer
# half-uploaded. Queue instead of cancelling, so a run that is already uploading
# is allowed to finish.
#
# Note this only serialises RUNS of this workflow against each other -- it
# does not freeze the `main` ref itself. An ordinary merge (or any other push)
# can still land on main while a run here is mid-flight, between its checkout
# and its own push in "Bump version, commit, and tag" below. That step retries
# against exactly that race; see the comment there.
concurrency:
  group: win-app-audio-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app
    # windows-latest ships Visual Studio 18, which node-gyp cannot detect yet,
    # breaking every native module build. VS2022 is present on windows-2022.
    runs-on: windows-2022
    timeout-minutes: 45

    # forge.config.ts only skips the AppX and Deb makers when PLATFORM is set;
    # its own comment warns that the AppX maker freezes CI.
    env:
      PLATFORM: win32

    steps:
      # fetch-depth: 0 is required below -- the version-bump step walks
      # `git log <last-tag>..HEAD` and needs full history plus every tag to
      # find "the most recent v* tag". The default shallow (depth-1) clone
      # would see neither.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Decides whether this push warrants a real, versioned release, and if
      # so what the next version is. Deliberately plain git/gh/node shell,
      # not a third-party "bump version" or "conventional commits" action:
      # this step pushes commits and tags straight to main, and that is not
      # somewhere to add a new, unpinned marketplace dependency just to save
      # a few lines of grep. This re-implements just the slice of
      # release-please's own rule that we need:
      #   - any feat: (or feat(scope):) commit                 -> minor
      #   - else any fix:/perf:/revert: commit (with scope)    -> patch
      #   - else (only chore/docs/ci/style/test/refactor)      -> no release
      #   - a ! before the colon, or a BREAKING CHANGE: footer,
      #     overrides all of the above                         -> major
      # Only runs for a genuine push to main -- workflow_dispatch and the two
      # frozen legacy branches must never cut a release.
      #
      # continue-on-error: true for the same reason as "Bump version, commit,
      # and tag" below: this step has its own `exit 1` (the "not a plain
      # X.Y.Z semver" guard) and a `node -p` that can throw, and without
      # this it would take the whole job down exactly like the bump step
      # used to -- "Install dependencies" through "Make installer" skipped,
      # then "Publish release" (the ROLLING build, unrelated to any of
      # this) failing on "no assets to upload". Downstream steps already
      # check `steps.bump.outcome` rather than `should_release` for exactly
      # this class of problem; "Fail the job if a due release did not
      # complete" at the very end additionally checks
      # `steps.release.outcome` directly, since a failure here means
      # `should_release` itself was never written and so can't be relied
      # on to say a release was due.
      - name: Decide release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -e

          # v[0-9]* rather than v* -- a stray tag like `vendor-freeze` would
          # otherwise match and get treated as a version.
          LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)

          if [ -z "$LAST_TAG" ]; then
            # No v* tag yet -- this is the first release cut by this
            # workflow. Scan the whole history rather than crashing on an
            # empty range.
            echo "No previous v* tag found; scanning full history."
            RANGE="HEAD"
          else
            echo "Last release tag: $LAST_TAG"
            RANGE="$LAST_TAG..HEAD"
          fi

          # Subjects decide feat/fix/breaking-bang; bodies are scanned
          # separately for a BREAKING CHANGE: footer. Order/commit-association
          # doesn't matter -- we only need to know whether ANY commit in range
          # trips each rule.
          #
          # %b includes merge commit bodies, and this repo merge-commits its
          # PRs -- so a PR description ends up in here too. The footer match
          # below is anchored to the start of a line (^BREAKING[ -]CHANGE:,
          # release-please accepts the hyphenated form as well) specifically
          # so that a PR whose description merely mentions the words
          # "BREAKING CHANGE:" in a sentence -- like this PR's own README
          # section explaining this rule -- can't accidentally force a major
          # bump. An unanchored `grep -q 'BREAKING CHANGE:'` would match that
          # sentence anywhere on any line.
          SUBJECTS=$(git log "$RANGE" --format='%s' || true)
          BODIES=$(git log "$RANGE" --format='%b' || true)

          if echo "$SUBJECTS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' || echo "$BODIES" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP=minor
          elif echo "$SUBJECTS" | grep -qE '^(fix|perf|revert)(\([^)]*\))?:'; then
            BUMP=patch
          else
            BUMP=none
          fi

          echo "Computed bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          if [ "$BUMP" = "none" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(node -p "require('./package.json').version")

          # Refuse to guess at a bump for anything that isn't a plain X.Y.Z --
          # a prerelease suffix (1.5.2-beta.1) or a stray non-numeric part
          # would otherwise fail deep inside the arithmetic below with a
          # cryptic "invalid arithmetic operator" and no context.
          if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$CURRENT' is not a plain X.Y.Z semver; refusing to guess the next version."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # The 10# base prefix matters: a version part with a leading zero
          # (e.g. the "08" in 1.08.2) would otherwise be parsed as octal by
          # bash's arithmetic context and blow up with "value too great for
          # base" the moment it hit a digit like 8 or 9.
          case "$BUMP" in
            major) MAJOR=$((10#$MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((10#$MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((10#$PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Current version: $CURRENT -> new version: $NEW_VERSION"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Bumps package.json + .release-please-manifest.json together (they
      # must stay in agreement), commits, tags, and pushes -- BEFORE the app
      # is built. Squirrel's update check compares the version baked into the
      # running app against the version on the release; building first and
      # tagging after would ship an installer whose own version already
      # equals (or exceeds) the tag it's supposedly updating to, so it could
      # never see itself as out of date.
      #
      # Pushing here with the default GITHUB_TOKEN does NOT retrigger this
      # (or any) `on: push` workflow -- GitHub's loop-prevention rule for
      # actions-authored pushes -- so this does not cause win-app-audio.yml
      # (or build.yml / multiplatform_build.yml, which also trigger on
      # push-to-main) to run again on the commit it creates. This run simply
      # continues on to build that commit itself.
      #
      # What the `concurrency` group at the top of this file does NOT protect
      # against: it only stops another RUN OF THIS WORKFLOW from executing in
      # parallel. It does nothing to stop an ordinary merge (or any other
      # push) from moving the `main` ref while this run is still sitting in
      # checkout/setup, several steps before it gets here -- that merge
      # happens the instant it's clicked, independent of whether this
      # workflow's steps are running or queued. If that happens, `git push`
      # below is a plain non-fast-forward rejection. Retry by fetching and
      # rebasing our one small commit onto whatever main has become, a few
      # times, rather than dying red on a race we can trivially recover from.
      # The tag is only created once the commit has actually landed, so it
      # never ends up pointing at a pre-rebase, unreachable commit.
      #
      # `continue-on-error: true` -- and everything that follows from it --
      # is new after this workflow's first real run. That run bumped
      # package.json to 1.6.0, then failed to push because main has a
      # ruleset requiring PRs (GH013). Because this step had no
      # continue-on-error, the whole job died right there: "Install
      # dependencies", "Package" and "Make installer" all got skipped, so
      # "Collect release assets" and "Publish release" (the ROLLING
      # win-per-app-audio prerelease, which has shipped on every push to
      # main since long before this release machinery existed and has
      # nothing to do with it) had nothing to publish and failed too. A
      # bypass entry for the github-actions actor is being added to main's
      # ruleset separately so the push itself should eventually succeed --
      # but this step must not be able to take the rolling build down
      # with it again if it, or anything like it, ever fails for any other
      # reason. So: this step now degrades gracefully instead of aborting
      # the job --
      #   - continue-on-error: true means a failure here is recorded as
      #     steps.bump.outcome == 'failure' but does NOT stop later steps
      #     from running (steps.bump.conclusion is forced to 'success', so
      #     plain `failure()` no longer sees it -- every later step that
      #     cares whether the bump actually happened checks
      #     `steps.bump.outcome` explicitly instead, never should_release
      #     alone, since should_release only says a release was *wanted*).
      #   - on ANY failure path below, the working tree is reset back to
      #     the commit this step started from, so "Install dependencies"
      #     through "Publish release" -- the rolling build -- still run
      #     against real, unbumped source instead of a half-written
      #     package.json or a local commit that was never actually pushed
      #     anywhere.
      #   - the job still has to end red when a release was due and didn't
      #     happen, or this whole gap goes unnoticed; see "Fail the job if
      #     a due release did not complete" at the very end of this file.
      #
      # Recovery once a red run like this is seen: just re-run the workflow
      # (or push again) once the actual cause is fixed. This was verified
      # end-to-end, not assumed -- re-running after a failed bump takes the
      # exact same path as an ordinary successful run: checkout returns to
      # the pre-bump commit, "Decide release" recomputes the same version
      # (the failed run's bump commit never landed, so it isn't in history
      # to change that), the branch push either succeeds outright or, if
      # something else pushed to main in the meantime, is a plain
      # non-fast-forward that the retry loop below handles normally
      # (correctly NOT matched by the GH013 grep), the tag and release
      # publish, and the job goes green. The one caveat already covered in
      # the README applies here too: if a run's branch push lands but its
      # tag push then fails, the version it claimed is skipped (the next
      # run computes e.g. 1.7.0, not a re-attempt at 1.6.0) rather than
      # reused or double-bumped -- annoying, but harmless.
      - name: Bump version, commit, and tag
        id: bump
        if: steps.release.outputs.should_release == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.release.outputs.version }}"

          # Snapshot HEAD before touching anything, so any failure below --
          # whether one of the two explicit cases this step now
          # distinguishes, or something unanticipated like a rebase
          # conflict -- can hand back a clean, unbumped tree. See the big
          # comment above this step for why that now matters: the bump
          # runs before the build, so this used to be able to take the
          # rolling build down with it.
          #
          # Named PRE_BUMP_HEAD rather than the more obvious ORIG_HEAD --
          # git itself writes a ref literally called ORIG_HEAD as part of
          # what `git rebase` does a few lines below, and reusing that name
          # for an unrelated shell variable sitting right next to a rebase
          # call is exactly the kind of thing that reads fine today and
          # confuses somebody in six months.
          PRE_BUMP_HEAD=$(git rev-parse HEAD)

          restore_tree() {
            echo "Bump failed -- restoring the working tree to $PRE_BUMP_HEAD (pre-bump) so the build below runs from clean, unbumped source instead of a half-written package.json or an orphaned local commit."
            # In case the failure happened mid-rebase (see the retry loop
            # below), clear that state first -- a bare `reset --hard` on
            # top of an in-progress rebase can leave .git/rebase-merge
            # behind and confuse the next git command in this same job.
            git rebase --abort >/dev/null 2>&1 || true
            # If this reset itself fails (disk/permissions weirdness, a
            # detached-HEAD edge case, ...) the tree is left exactly as
            # dangerous as this function exists to prevent -- bumped
            # package.json, maybe an orphaned commit -- and the build below
            # would silently package a version that was never released.
            # There's nothing more we can do about it from here, but at
            # least say so loudly instead of letting it pass unnoticed.
            git reset --hard "$PRE_BUMP_HEAD" || echo "::error::restore_tree failed -- the working tree may still be bumped. The build that follows this step may package an unreleased version."
          }

          # Safety net for any failure this script doesn't explicitly
          # handle below (the node script throwing, `git commit` failing,
          # a genuine rebase conflict, the tag push failing after the
          # branch push already succeeded...). Under `set -e`, any of
          # those aborts the script anyway -- this just guarantees
          # restore_tree still runs on the way out. It does NOT fire for
          # the two `exit 1`s further down (bash does not run ERR traps
          # for an explicit `exit`), so those call restore_tree themselves
          # before exiting.
          trap restore_tree ERR

          node -e "
            const fs = require('fs');

            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            const manifestPath = '.release-please-manifest.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest['.'] = '$VERSION';
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .release-please-manifest.json
          git commit -m "chore(release): v$VERSION"

          # HEAD is detached (actions/checkout doesn't leave a local main
          # branch), so push it explicitly onto main.
          #
          # A rejected push means one of two very different things, and
          # conflating them is exactly what happened on this workflow's
          # first real run:
          #
          #   1. A genuine race -- an ordinary merge (or any other push)
          #      landed on main between this run's checkout and this push.
          #      That's a plain non-fast-forward rejection, and fetching +
          #      rebasing this one small commit onto the new tip of main
          #      and pushing again is a real fix. This is what the retry
          #      loop below is for, and that part is unchanged.
          #
          #   2. A repository ruleset rejection (GH013, "push declined due
          #      to repository rule violations" / "Changes must be made
          #      through a pull request"). Nothing moved. Retrying hits the
          #      exact same rule every time. On the actual failed run this
          #      was misdiagnosed as case 1: the loop burned all 5
          #      attempts, logged "Current branch main is up to date."
          #      between every single one of them (proof main never
          #      moved), and then reported "main kept moving underneath
          #      this run" -- which was simply false, and would send
          #      whoever reads the log looking for a race that never
          #      happened.
          #
          # So: capture the push output and check it for the ruleset
          # signature before ever treating a rejection as a race. If it
          # matches, stop immediately -- retrying cannot help -- and say
          # what is actually wrong.
          #
          # The check itself uses a here-string (`<<<`), not
          # `echo "$X" | grep -q PATTERN`. Reason: under `pipefail` (this
          # shell's default, see the note at the top of this file), if
          # `grep -q` finds its match early and exits before `echo` has
          # finished writing, `echo` can be killed by SIGPIPE (status 141),
          # and pipefail then reports that as the pipeline's status instead
          # of grep's 0 -- so the `if` below would read as "no match" even
          # though the pattern was right there. Not reachable today with a
          # few KB of git output, but latent, and `<<<` sidesteps it
          # entirely by never opening a pipe. (The unrelated `echo | grep`
          # pairs already in "Decide release" above are deliberately left
          # as-is -- that step's bump-rule logic is out of scope here.)
          ATTEMPT=1
          MAX_ATTEMPTS=5
          while true; do
            PUSH_OUTPUT=$(git push origin HEAD:main 2>&1) && { echo "$PUSH_OUTPUT"; break; }
            echo "$PUSH_OUTPUT"

            if grep -qE 'GH013|push declined due to repository rule violations|Changes must be made through a pull request' <<<"$PUSH_OUTPUT"; then
              # GH013 is the umbrella code for every ruleset violation --
              # required signatures, linear history, required status
              # checks, tag protection, not just "PRs only". Only the
              # "Changes must be made through a pull request" bullet is the
              # bypass-list problem from this workflow's first real run;
              # print GitHub's own "remote: - ..." bullet line(s) so
              # whoever reads this sees the actual rule that fired instead
              # of just an assumption of which one it was.
              echo "GitHub's reported rule violation(s):"
              grep -E '^remote: -' <<<"$PUSH_OUTPUT" || true
              echo "::error::Push to main was rejected by a repository ruleset (GH013), not a race -- main did not move, so retrying would only fail the same way again. See the 'remote: - ...' line(s) above for which rule actually fired. If it names \"Changes must be made through a pull request\", the likely fix is adding the github-actions actor to main's ruleset bypass list (repo Settings > Rules > Rulesets > the ruleset covering main > Bypass list); a different named rule needs a different fix. Re-run this workflow once fixed. The rolling win-per-app-audio build below will still run, from unbumped source."
              restore_tree
              exit 1
            fi

            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Could not push $VERSION to main after $MAX_ATTEMPTS attempts -- main kept moving underneath this run (a genuine non-fast-forward race, not a ruleset rejection). The rolling win-per-app-audio build below will still run, from unbumped source."
              restore_tree
              exit 1
            fi
            echo "Push rejected -- fetching and rebasing onto the new tip of main, attempt $ATTEMPT/$MAX_ATTEMPTS."
            git fetch origin main
            git rebase origin/main
            ATTEMPT=$((ATTEMPT + 1))
          done

          # Only tag now that we know exactly which commit landed on main.
          git tag "v$VERSION"

          # A rejected tag push gets exactly the same ruleset-vs-something-
          # else treatment as the branch push above, for the same reason:
          # tag-protection rulesets (e.g. a "Restrict creations" rule on
          # `v*`) are just as common as branch ones, and this repo
          # demonstrably has at least one ruleset already. Without this,
          # a GH013 here would fall straight into the generic `trap
          # restore_tree ERR` below with nothing but a raw git error --
          # the exact misleading-diagnosis problem this whole change exists
          # to fix, just moved one push later. The commit itself already
          # landed on main by this point regardless of how the tag push
          # goes; only the tag (and therefore the versioned release) is at
          # risk. restore_tree still resets this run's LOCAL tree back to
          # pre-bump source for the rolling build below, even though the
          # remote main now has the bump commit -- main will simply carry
          # a version bump with no tag on it until the next push recomputes
          # and republishes it (see the README's note on this same
          # end-of-step gap for the ordinary success case).
          TAG_PUSH_OUTPUT=$(git push origin "v$VERSION" 2>&1) || {
            echo "$TAG_PUSH_OUTPUT"
            if grep -qE 'GH013|push declined due to repository rule violations|Changes must be made through a pull request' <<<"$TAG_PUSH_OUTPUT"; then
              echo "GitHub's reported rule violation(s):"
              grep -E '^remote: -' <<<"$TAG_PUSH_OUTPUT" || true
              echo "::error::Push of tag v$VERSION was rejected by a repository ruleset (GH013). The commit already landed on main -- only the tag failed. This is most likely a separate tag-protection ruleset, not the branch ruleset handled above; check Settings > Rules > Rulesets for one covering tags and add github-actions to its bypass list if that's what the rule line above names. No tag means no versioned release can be published from this run."
            else
              echo "::error::Failed to push tag v$VERSION even though the commit landed on main -- see the git output above for the actual cause. No tag means no versioned release can be published from this run."
            fi
            restore_tree
            exit 1
          }
          echo "$TAG_PUSH_OUTPUT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Fails loudly here rather than silently falling back at runtime.
      - name: Verify native module compiled
        shell: bash
        run: |
          set -e
          find node_modules/win-app-audio -name '*.node' -print
          test -f node_modules/win-app-audio/build/Release/win_app_audio.node
          # win-capture is the GPU-downscaled screen capture addon. Without
          # this check a build failure ships an app that looks fine and
          # silently falls back to Chromium capture at the old frame rate --
          # index.js is deliberately non-fatal on a missing binary, so nothing
          # else would ever complain.
          find node_modules/win-capture -name '*.node' -print
          test -f node_modules/win-capture/build/Release/win_capture.node

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Package
        run: pnpm package

      - name: Confirm addon shipped in the package
        shell: bash
        run: |
          echo "--- resources dir ---"
          find out -maxdepth 4 -name 'resources' -type d -exec ls -la {} \;
          echo "--- any win-app-audio on disk ---"
          find out -path '*win-app-audio*' -maxdepth 8 | head -20
          echo "--- unpacked natives ---"
          find out -name '*.node' | head -20
          echo "--- asar contents ---"
          ASAR=$(find out -name 'app.asar' -print -quit)
          if [ -n "$ASAR" ]; then
            npx --yes @electron/asar list "$ASAR" | grep -i -E 'win-app-audio|\.node' | head -20 || echo "(no matches inside asar)"
          fi
          echo "--- verdict ---"
          FAIL=0
          for N in win_app_audio win_capture; do
            if [ -n "$(find out -name "$N.node" -print -quit)" ]; then
              echo "OK: $N present"
            else
              echo "MISSING: $N not packaged"; FAIL=1
            fi
          done
          test "$FAIL" -eq 0

      # continue-on-error stays true for the rolling dev build -- a broken
      # `make` there just means today's win-per-app-audio asset doesn't
      # update, which is tolerable. On the release path it must fail loudly
      # instead: silently continuing past a failed `make` here would go on
      # to publish a real, non-prerelease release with missing or partial
      # Squirrel assets, which is exactly the bug this whole change exists
      # to prevent.
      #
      # Gated on steps.bump.outcome, not should_release: should_release only
      # says a release was wanted, not that the bump actually happened. If
      # "Bump version, commit, and tag" failed (ruleset rejection, exhausted
      # race retries, ...) there is no versioned release being attempted
      # this run regardless of should_release -- "Verify Squirrel release
      # assets exist" and "Publish versioned release" below are both gated
      # the same way and will not run -- so a `make` hiccup here must stay
      # tolerable, exactly like the no-release-due case, instead of taking
      # the rolling build down too.
      - name: Make installer
        run: pnpm make
        continue-on-error: ${{ steps.bump.outcome != 'success' }}

      # if: always() on this and the next two steps -- a release-worthy push
      # whose `make` fails now fails the job (continue-on-error is false
      # above), and by default GitHub Actions skips every later step without
      # its own `if:` once one has failed. Without always() here, that would
      # also take out today's win-per-app-audio rolling asset even though
      # nothing about the rolling build itself changed -- these three steps
      # still only ever act on whatever out/make actually contains.
      - name: Upload packaged app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoat-windows-per-app-audio
          path: |
            out/make/**/*
            out/*-win32-*/**
          if-no-files-found: warn
          retention-days: 14

      # Actions artifacts need a GitHub login to download, so publish the
      # installer as a release asset instead -- that is a plain public link.
      - name: Collect release assets
        id: assets
        if: always()
        shell: bash
        run: |
          mkdir -p release
          echo "--- what make produced ---"
          find out/make -type f | head -30

          SETUP=$(find out/make -name '*.exe' -print -quit)
          if [ -n "$SETUP" ]; then
            cp "$SETUP" "release/Stoat-per-app-audio-Setup.exe"
          fi

          ZIP=$(find out/make -name '*.zip' -print -quit)
          if [ -n "$ZIP" ]; then
            cp "$ZIP" "release/Stoat-per-app-audio-portable.zip"
          fi

          # Fall back to zipping the packaged folder if no maker produced one.
          if [ ! -f release/Stoat-per-app-audio-portable.zip ]; then
            APPDIR=$(find out -maxdepth 1 -type d -name '*-win32-*' -print -quit)
            if [ -n "$APPDIR" ]; then
              powershell -Command "Compress-Archive -Path '$APPDIR/*' -DestinationPath 'release/Stoat-per-app-audio-portable.zip' -Force"
            fi
          fi

          echo "--- release assets ---"
          ls -la release

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="win-per-app-audio"
          NOTES="Stoat for Desktop with per-application screen share audio on Windows.

          Sharing a **window** now sends only that application's sound instead of
          the entire system mix. Sharing a whole screen, or running a Windows
          build without process loopback support, falls back to the previous
          behaviour automatically.

          Built from branch \`feat/windows-per-app-audio\` (commit \`${GITHUB_SHA:0:7}\`).

          Diagnostics are written to \`%APPDATA%\Stoat\logs\app-audio.log\`.

          Unofficial build -- not affiliated with the Stoat project."

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY"               --title "Stoat: per-app screen share audio (Windows)"               --notes "$NOTES" --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          fi

          shopt -s nullglob
          FILES=(release/*)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            echo "no assets to upload"; exit 1
          fi

          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # Squirrel.Windows (MakerSquirrel here) does not poll the exe, GitHub's
      # "latest release" API, or anything update-electron-app-shaped -- it
      # downloads a plain-text RELEASES index (nupkg filename + SHA1 + size,
      # one line per version) and then the exact *-full.nupkg it names. Both
      # come out of `pnpm make` under out/make/squirrel.windows alongside the
      # Setup.exe, and the "Collect release assets" step above throws them
      # away -- it only globs for *.exe/*.zip for the rolling build. Skipping
      # this check would let a `make` that silently dropped the nupkg (or
      # produced RELEASES with no matching payload) through to a published
      # release that every installed app would fail to update from.
      #
      # `pnpm make` has never actually run to completion in CI before this
      # change (it's had continue-on-error: true since day one), so the most
      # likely first failure here is out/make/squirrel.windows not existing
      # at all. That path is checked explicitly, with its own message, and
      # every `find` below it is followed by `|| true`: under `set -e`,
      # `find` on a missing directory exits non-zero, and stderr is
      # discarded by the 2>/dev/null on the same line -- without `|| true`
      # the step would abort silently right there, before any of the
      # ::error:: messages below it ever had a chance to print, in exactly
      # the failure case this step exists to report clearly.
      # Gated on steps.bump.outcome == 'success', not should_release --
      # should_release only says a release was wanted; steps.bump.outcome
      # says whether the bump (and its push to main) actually happened. A
      # push rejected by main's ruleset, or a race that exhausted its
      # retries, leaves should_release == 'true' with no real bump behind
      # it, and there is nothing versioned to verify in that case.
      - name: Verify Squirrel release assets exist
        if: steps.bump.outcome == 'success'
        shell: bash
        run: |
          set -e
          SQUIRREL_DIR="out/make/squirrel.windows"

          if [ ! -d "$SQUIRREL_DIR" ]; then
            echo "::error::$SQUIRREL_DIR does not exist -- 'pnpm make' did not produce a squirrel.windows output at all. Check the 'Make installer' step above."
            exit 1
          fi

          echo "--- squirrel.windows contents ---"
          find "$SQUIRREL_DIR" -type f

          RELEASES_FILE=$(find "$SQUIRREL_DIR" -name 'RELEASES' -print -quit 2>/dev/null || true)
          NUPKG_FILE=$(find "$SQUIRREL_DIR" -name '*-full.nupkg' -print -quit 2>/dev/null || true)
          SETUP_FILE=$(find "$SQUIRREL_DIR" -name '*.exe' -print -quit 2>/dev/null || true)

          if [ -z "$RELEASES_FILE" ]; then
            echo "::error::No RELEASES file under $SQUIRREL_DIR -- Squirrel has no update feed to read, so auto-update would silently never fire for anyone on this release. Check the 'Make installer' step above."
            exit 1
          fi

          if [ -z "$NUPKG_FILE" ]; then
            echo "::error::No *-full.nupkg under $SQUIRREL_DIR -- RELEASES would point at a payload that was never produced."
            exit 1
          fi

          if [ -z "$SETUP_FILE" ]; then
            echo "::error::No Setup.exe under $SQUIRREL_DIR -- nothing for a fresh install to download."
            exit 1
          fi

          echo "OK: $RELEASES_FILE"
          echo "OK: $NUPKG_FILE"
          echo "OK: $SETUP_FILE"

      # The real, semver-tagged, non-prerelease release. update.electronjs.org
      # (what update-electron-app's ElectronPublicUpdateService talks to)
      # only ever serves a repo's latest release that is BOTH semver-tagged
      # AND not marked prerelease -- it is the sole thing this repo publishes
      # that the auto-updater can see at all. win-per-app-audio above is a
      # prerelease on a fixed tag on purpose, so it stays invisible to it.
      #
      # Ship the entire out/make/squirrel.windows output verbatim, under its
      # own filenames -- Squirrel resolves the .nupkg it needs by the exact
      # name written inside RELEASES, so renaming (like the rolling build
      # does above for its own assets) would break the update.
      #
      # Created as a draft first, on purpose: gh release create without
      # --draft makes the release live (and visible to update.electronjs.org)
      # immediately, before a single asset is attached. A client polling in
      # that window would see RELEASES pointing at a .nupkg that doesn't
      # exist yet -- a 404 the update service then caches -- and if the
      # upload step failed partway through, that broken, half-published
      # state would be permanent even though the job itself goes red. Upload
      # everything first, then flip it to public in one step at the end.
      # Same reasoning as "Verify Squirrel release assets exist" above:
      # gated on the bump having actually succeeded, not merely on a
      # release having been wanted.
      - name: Publish versioned release
        if: steps.bump.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.release.outputs.version }}"
          BUMP="${{ steps.release.outputs.bump }}"
          TAG="v$VERSION"

          shopt -s globstar nullglob
          ASSETS=()
          for f in out/make/squirrel.windows/**; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No files found under out/make/squirrel.windows to publish."
            exit 1
          fi

          echo "--- assets to publish ---"
          printf '%s\n' "${ASSETS[@]}"

          NOTES="Automated release from \`main\` (bump: $BUMP).

          Commit: \`$(git rev-parse --short HEAD)\`"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY"               --title "Stoat for Desktop v$VERSION"               --notes "$NOTES" --draft
          else
            # Re-run after a previous partial failure -- the release (still a
            # draft at this point) already exists, just refresh its notes.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"

          # Every asset is confirmed uploaded -- safe to make it a real,
          # public, non-prerelease release now.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # If anything from "Bump version, commit, and tag" onward fails, main
      # is left on a commit whose package.json already claims a version that
      # was never actually released (see the README caveat on this -- it is
      # a real, if narrow, gap: this step tidies up the tag namespace, not
      # the version bump itself). Deleting the tag here means there is never
      # a v<version> tag on the repo without a matching GitHub release next
      # to it, and the failure stays visible instead of silently leaving a
      # dangling tag around.
      #
      # Gated on should_release (a release was wanted at all) AND
      # steps.bump.outcome != 'success' OR failure() -- not, as it might
      # look, redundant with steps.bump.outcome == 'success'.
      #
      # The first cut of this condition after the continue-on-error
      # restructure was `failure() && steps.bump.outcome == 'success'`,
      # reasoned as: "Bump version, commit, and tag" now runs with
      # continue-on-error: true, so its own failure no longer trips plain
      # failure() (steps.bump.conclusion is forced to 'success' even when
      # steps.bump.outcome is 'failure') -- fine, because a failed bump
      # restores the tree before it ever gets to `git tag`, so there's
      # nothing to clean up. That reasoning has a hole: it assumed the tag
      # is created atomically with the rest of the step succeeding, but
      # `git tag` and its push both run *inside* the same step, before the
      # step's own exit code is known. A tag push that half-lands --
      # accepted by the remote but git still exits non-zero (a hook, a
      # proxy hiccup, the runner being cancelled between the two commands)
      # -- leaves a real tag on origin while steps.bump.outcome is
      # 'failure', which the old condition would skip entirely. A stray
      # `v<version>` tag with no release is worse than it sounds: it
      # becomes "the most recent v* tag" for the *next* run's "Decide
      # release" step, which can compute BUMP=none against it and skip a
      # release that was actually due, with nothing on GitHub or the
      # updater to show for the version that tag claims.
      #
      # So: run whenever a release was wanted and the bump did NOT cleanly
      # succeed (covers the half-landed-tag case above, belt-and-suspenders
      # even though "Bump version, commit, and tag" tries to avoid it) OR
      # something later genuinely failed (covers the original "bump
      # succeeded, Package/Make/Verify Squirrel/Publish versioned release
      # failed" case). `!cancelled()` rather than `always()` -- a manually
      # cancelled run shouldn't have this run a cleanup implying something
      # was wrong with the release logic itself. The tag-deletion push
      # itself stays a no-op (falls into its own `|| echo`) whenever there
      # was no tag to delete, so running this a little more often than
      # strictly necessary is harmless.
      - name: Clean up unreleased tag on failure
        if: "!cancelled() && steps.release.outputs.should_release == 'true' && (failure() || steps.bump.outcome != 'success')"
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          git push origin ":refs/tags/v$VERSION" || echo "tag v$VERSION was not pushed, or is already gone"

      # Everything above this point -- including the rolling win-per-app-
      # audio build and its own prerelease publish -- is now allowed to
      # succeed even when the versioned release did not happen; that is the
      # entire point of the continue-on-error / restore_tree restructure on
      # "Bump version, commit, and tag" (and, for the same reason, on
      # "Decide release") above. But a release that was due and silently
      # didn't happen must not be allowed to look like an ordinary green
      # run, or nobody will notice the ruleset bypass-list gap (or whatever
      # else broke) until someone goes looking for a release that was never
      # published. So: fail the job here -- deliberately the very last
      # step, with `!cancelled()` (not `always()`, so a manually cancelled
      # run doesn't get an extra misleading "release did not complete"
      # error alongside the cancellation) so every rolling-build step above
      # it has already had its chance to run and publish first -- when
      # either of two things happened:
      #   - "Decide release" itself failed (steps.release.outcome ==
      #     'failure'). Its own should_release output was then never
      #     written at all, so this is checked directly rather than via
      #     should_release, which would otherwise read as empty/false and
      #     let the run end green with no release and no explanation.
      #   - "Decide release" succeeded, did decide a release was due
      #     (should_release == 'true'), but the bump did not actually
      #     succeed (steps.bump.outcome != 'success') -- a ruleset
      #     rejection, an exhausted race, or a half-landed tag push, all
      #     covered above.
      - name: Fail the job if a due release did not complete
        if: "!cancelled() && (steps.release.outcome == 'failure' || (steps.release.outputs.should_release == 'true' && steps.bump.outcome != 'success'))"
        shell: bash
        run: |
          if [ "${{ steps.release.outcome }}" = "failure" ]; then
            echo "::error::The 'Decide release' step failed, so it's unknown whether a release was even due on this push -- see that step's log above for the actual cause. The rolling win-per-app-audio pre-release was still rebuilt and republished from unbumped source; only the versioned release path is affected."
          else
            echo "::error::A ${{ steps.release.outputs.bump }} release (v${{ steps.release.outputs.version }}) was due on this push but did not happen -- see the 'Bump version, commit, and tag' step above for the actual cause. The rolling win-per-app-audio pre-release was still rebuilt and republished from unbumped source; only the versioned release is missing."
          fi
          exit 1
