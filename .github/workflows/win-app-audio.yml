name: Windows per-app audio build

# Builds the Windows app with the native per-process audio capture module and
# uploads the installer, so the addon never has to be compiled by hand.

on:
  push:
    branches:
      # main is the trunk now; the old feature branch is frozen but still
      # builds so anything left on it is not silently dropped.
      - main
      - fix/capture-and-shell-stability
      - feat/windows-per-app-audio
  workflow_dispatch:

# Every run publishes to the same fixed release tag, and the workflow now fires
# from more than one branch. Without this, two pushes land on the same assets at
# once and whichever finishes last wins -- possibly with the other's installer
# half-uploaded. Queue instead of cancelling, so a run that is already uploading
# is allowed to finish.
#
# This also matters for the versioned release path now that "Bump version and
# tag" below computes its version from the latest `v*` tag instead of from a
# branch commit it pushes itself (see that step's comment for the full
# history): two runs racing concurrently would both read the same latest tag
# and compute the same next version. Verified this is NOT the harmless "second
# push fails, tag already exists" case it might look like: two runs racing off
# the same `main` HEAD would tag that same commit, so the second run's
# `git push origin v<version>` sees the tag already exists at the commit it's
# trying to push it to and reports "Everything up-to-date" -- exit 0, no
# error, and both runs go on to separately build and publish over each other's
# assets anyway. Queueing is still the right fix; it just avoids the wasted
# duplicate work (and, worse, the two runs' `gh release upload --clobber`
# racing each other) directly, rather than relying on a push conflict that
# would not actually happen here.
concurrency:
  group: win-app-audio-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app
    # windows-latest ships Visual Studio 18, which node-gyp cannot detect yet,
    # breaking every native module build. VS2022 is present on windows-2022.
    runs-on: windows-2022
    timeout-minutes: 45

    # forge.config.ts only skips the AppX and Deb makers when PLATFORM is set;
    # its own comment warns that the AppX maker freezes CI.
    env:
      PLATFORM: win32

    steps:
      # fetch-depth: 0 is required below -- the version-bump step walks
      # `git log <last-tag>..HEAD` and needs full history plus every tag to
      # find "the most recent v* tag". The default shallow (depth-1) clone
      # would see neither.
      #
      # This carries more weight than it used to: tags are now the sole
      # source of the current version (see "Decide release" below), not
      # `package.json`. A shallow clone wouldn't just miscount commits in
      # range any more -- it would silently fall back to whatever version
      # happens to be sitting in `package.json` in this commit and rebase
      # every future release off that stale number instead of erroring, so
      # losing full history here is a much bigger deal than it once was.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Decides whether this push warrants a real, versioned release, and if
      # so what the next version is. Deliberately plain git/gh/node shell,
      # not a third-party "bump version" or "conventional commits" action:
      # the release path this feeds pushes a tag straight to the repo, and
      # that is not somewhere to add a new, unpinned marketplace dependency
      # just to save a few lines of grep. This re-implements just the slice
      # of release-please's own rule that we need:
      #   - any feat: (or feat(scope):) commit                 -> minor
      #   - else any fix:/perf:/revert: commit (with scope)    -> patch
      #   - else (only chore/docs/ci/style/test/refactor)      -> no release
      #   - a ! before the colon, or a BREAKING CHANGE: footer,
      #     overrides all of the above                         -> major
      # Only runs for a genuine push to main -- workflow_dispatch and the two
      # frozen legacy branches must never cut a release.
      #
      # continue-on-error: true for the same reason as "Bump version and
      # tag" below: this step has its own `exit 1` (the "not a plain
      # X.Y.Z semver" guard) and a `node -p` that can throw, and without
      # this it would take the whole job down exactly like the bump step
      # used to -- "Install dependencies" through "Make installer" skipped,
      # then "Publish release" (the ROLLING build, unrelated to any of
      # this) failing on "no assets to upload". Downstream steps already
      # check `steps.bump.outcome` rather than `should_release` for exactly
      # this class of problem; "Fail the job if a due release did not
      # complete" at the very end additionally checks
      # `steps.release.outcome` directly, since a failure here means
      # `should_release` itself was never written and so can't be relied
      # on to say a release was due.
      - name: Decide release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -e

          # v[0-9]* rather than v* -- a stray tag like `vendor-freeze` would
          # otherwise match and get treated as a version.
          #
          # --merged HEAD, and the grep -xE filtering the list down to plain
          # X.Y.Z before `head -n1`: without --merged, a tag pushed on some
          # other branch (someone tagging a feature branch `v9.0.0`) would
          # silently outrank every real release tag here and drive the next
          # version -- `git log v9.0.0..HEAD` does not error even when
          # v9.0.0 shares no common ancestor with HEAD, so nothing would
          # catch this downstream either.
          #
          # Without the grep filter, `--sort=-v:refname` ranks a prerelease
          # ABOVE every plain release with a higher X.Y.Z once one exists,
          # because git's versionsort treats a bare suffix as sorting after
          # the same X.Y.Z with no suffix, but there is no rule configured
          # here to rank X.Y.Z-anything below the next X.Y.Z release.
          # Verified in a scratch repo: with tags v1.5.2, v1.6.0, v1.6.0-rc1,
          # v1.6, v1.10.0 and v2.0.0-beta.1 all present, plain
          # `--sort=-v:refname` with no filter picks v2.0.0-beta.1 as "the
          # latest" -- not v1.10.0. One human running `git tag v2.0.0-rc1`
          # on this repo would make CURRENT read as "2.0.0-rc1", trip the
          # X.Y.Z guard below, and fail this step -- which, because
          # should_release is then never written, fails "Fail the job if a
          # due release did not complete" on every subsequent push to main
          # until someone finds and deletes the stray tag. The old design
          # read CURRENT from package.json, where a stray prerelease tag was
          # cosmetic; reading it from the tag list makes this a real hazard,
          # so it's filtered out explicitly rather than trusted to sort
          # correctly.
          LAST_TAG=$(git tag --list 'v[0-9]*' --merged HEAD --sort=-v:refname \
            | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)

          if [ -z "$LAST_TAG" ]; then
            # No v* tag yet -- this is the first release cut by this
            # workflow. Scan the whole history rather than crashing on an
            # empty range.
            echo "No previous v* tag found; scanning full history."
            RANGE="HEAD"
          else
            echo "Last release tag: $LAST_TAG"
            RANGE="$LAST_TAG..HEAD"
          fi

          # Subjects decide feat/fix/breaking-bang; bodies are scanned
          # separately for a BREAKING CHANGE: footer. Order/commit-association
          # doesn't matter -- we only need to know whether ANY commit in range
          # trips each rule.
          #
          # %b includes merge commit bodies, and this repo merge-commits its
          # PRs -- so a PR description ends up in here too. The footer match
          # below is anchored to the start of a line (^BREAKING[ -]CHANGE:,
          # release-please accepts the hyphenated form as well) specifically
          # so that a PR whose description merely mentions the words
          # "BREAKING CHANGE:" in a sentence -- like this PR's own README
          # section explaining this rule -- can't accidentally force a major
          # bump. An unanchored `grep -q 'BREAKING CHANGE:'` would match that
          # sentence anywhere on any line.
          SUBJECTS=$(git log "$RANGE" --format='%s' || true)
          BODIES=$(git log "$RANGE" --format='%b' || true)

          # Here-strings (`<<<`), not `echo "$X" | grep -q PATTERN`. Under
          # `set -e` this shell also runs with pipefail (GitHub's default for
          # `bash` run: blocks), and `grep -q` exits the instant it finds a
          # match instead of reading the rest of its input. If `echo` still
          # has unwritten output queued when that happens, it gets SIGPIPE on
          # its next write, pipefail reports THAT as the pipeline's exit
          # status, and the `if`/`elif` reads false even though the pattern
          # was right there in the data. `%b` includes merge-commit bodies --
          # this repo merge-commits its PRs, so a full PR description lands
          # in BODIES -- and it only grows with every merged PR since the
          # last release, so this is not a one-off: measured on this repo's
          # own history right now, BODIES for v1.5.2..HEAD is already in the
          # tens of KB, and the no-tag bootstrap path (RANGE=HEAD, scanning
          # everything) is bigger still. A `BREAKING CHANGE:` footer lost to
          # this would silently ship a major bump as a minor, with nothing in
          # the log to say why. `<<<` sidesteps the whole failure mode by
          # never opening a pipe to begin with.
          if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<<"$SUBJECTS" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$BODIES"; then
            BUMP=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$SUBJECTS"; then
            BUMP=minor
          elif grep -qE '^(fix|perf|revert)(\([^)]*\))?:' <<<"$SUBJECTS"; then
            BUMP=patch
          else
            BUMP=none
          fi

          echo "Computed bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          if [ "$BUMP" = "none" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The current version comes from the latest v* tag (LAST_TAG,
          # computed above), NOT from package.json. This is the load-bearing
          # change in this file: the bump commit below is no longer pushed
          # to main (see "Bump version and tag" for why), so
          # package.json on main never advances -- it is permanently stuck
          # at whatever it was the last time a push to main actually landed
          # a bump. Reading CURRENT from package.json would therefore read
          # the same number release after release: the very first run here
          # would still correctly compute e.g. 1.5.2 -> 1.6.0, but the next
          # push warranting a release would read package.json, see "1.5.2"
          # again (unchanged, because nothing commits to main any more), and
          # recompute 1.6.0 a second time -- colliding with the tag and
          # release that already exist. Tags, not package.json, are now the
          # only durable record of what has actually been released; every
          # run that reaches "Bump version and tag" with should_release ==
          # 'true' creates and pushes a new v<version> tag (see below), so
          # the tag list stays authoritative even though package.json does
          # not.
          #
          # Fall back to package.json only in the genuine bootstrap case --
          # no v[0-9]* tag exists at all yet -- where there is nothing else
          # to read a starting version from.
          #
          # This can't tell "no tag exists" apart from "tags exist but
          # weren't fetched" (a shallow checkout, or `fetch-depth: 0` above
          # getting reverted) -- both look identical to LAST_TAG being
          # empty, and this falls back to package.json either way. That's a
          # silent wrong answer in the second case: package.json only ever
          # reflects the version as of the last successful bump+push (see
          # the block above) and is otherwise stale, so degrading to it
          # after a release has already been cut would recompute an
          # already-used version -- it degrades *safely* (the tag push
          # below is then rejected as already-existing rather than silently
          # overwriting a release) but it degrades *quietly*, so say so
          # loudly here rather than let the bump step's failure be the only
          # signal something upstream is wrong.
          if [ -z "$LAST_TAG" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            echo "::warning::No v[0-9]* tag found (or the checkout doesn't have full tag history -- see the 'fetch-depth: 0' comment on the Checkout step). Falling back to the version in package.json: $CURRENT. This is only correct if no release has ever been cut by this workflow -- if one has, this number is stale and the wrong starting point."
          else
            CURRENT="${LAST_TAG#v}"
          fi

          # Refuse to guess at a bump for anything that isn't a plain X.Y.Z --
          # a prerelease suffix (1.5.2-beta.1) or a stray non-numeric part
          # would otherwise fail deep inside the arithmetic below with a
          # cryptic "invalid arithmetic operator" and no context.
          if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::current version '$CURRENT' (from ${LAST_TAG:-package.json}) is not a plain X.Y.Z semver; refusing to guess the next version."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # The 10# base prefix matters: a version part with a leading zero
          # (e.g. the "08" in 1.08.2) would otherwise be parsed as octal by
          # bash's arithmetic context and blow up with "value too great for
          # base" the moment it hit a digit like 8 or 9.
          case "$BUMP" in
            major) MAJOR=$((10#$MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((10#$MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((10#$PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Current version: $CURRENT -> new version: $NEW_VERSION"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Writes the new version into package.json in the RUNNER'S WORKING TREE
      # ONLY -- no commit, no push to main -- then tags the commit being
      # built. This must still run BEFORE the app is built: Squirrel's
      # update check compares the version baked into the running app against
      # the version on the release, so the build needs the bumped number
      # baked in even though main itself never sees it.
      #
      # -- History: why this no longer commits or pushes --
      #
      # This step used to also `git commit` the bump and `git push origin
      # HEAD:main`. That was rejected on this workflow's first two real
      # release-worthy runs by main's repository ruleset ("Changes must be
      # made through a pull request", GH013) -- main requires every change
      # to go through a PR, and a CI-authored direct push is exactly what
      # that rule exists to stop. Adding the `github-actions` app to the
      # ruleset's bypass list would fix this cleanly, but that's a repo
      # Settings > Rules > Rulesets change only the repo owner can make, and
      # it is not happening. So: stop pushing to main entirely, rather than
      # keep failing (or retrying) against a rule that will never open for
      # this token. This is reversible if the bypass is ever added later, but
      # not cheaply: this change deleted ~60 lines here, including a
      # 5-attempt fetch/rebase retry loop and its branch-ruleset GH013
      # detection, both of which existed only because a direct push races a
      # `main` that can move underneath it -- restoring the commit+push means
      # rewriting that from scratch, not un-deleting a self-contained chunk.
      # And CURRENT should NOT go back to reading package.json even then --
      # that was only ever correct because the old design's bump commit kept
      # package.json in sync with what shipped; reading from the latest
      # v<version> tag is strictly better regardless of whether the push
      # target is a branch or nothing, since it's the one thing that can't
      # silently stop advancing.
      #
      # -- Consequence: package.json on main is now deliberately stale --
      #
      # With no push, package.json on main stops advancing the moment this
      # change lands -- it stays wherever the last successful bump+push left
      # it (or wherever it already was, if that never happened even once).
      # That's intentional, not a bug to "fix" later: the version record now
      # lives entirely in the `v<version>` git tags this step still creates
      # and pushes below, and "Decide release" reads its CURRENT version
      # from the latest one of those, not from package.json, for exactly
      # this reason (see the comment there). A reader of this repo's
      # `package.json` on `main` should not expect it to reflect the last
      # released version -- the tags are the source of truth; see the
      # README's Releases section, updated to say the same thing.
      #
      # -- What stays, and why --
      #
      # `continue-on-error: true` stays, and the working tree is still
      # snapshotted and restored on any failure below (the node script
      # throwing, or the tag push failing) -- this is the same graceful
      # degradation added after the GH013 failures, and it is still needed:
      # this step can still fail for reasons unrelated to main (a corrupt
      # package.json, a tag-protection ruleset on `v*`, ...), and a failure
      # here must still let "Install dependencies" through "Publish release"
      # -- the ROLLING win-per-app-audio prerelease, unrelated to any of
      # this -- run and publish from clean, unbumped source rather than
      # taking it down too.
      #   - continue-on-error: true means a failure here is recorded as
      #     steps.bump.outcome == 'failure' but does NOT stop later steps
      #     from running (steps.bump.conclusion is forced to 'success', so
      #     plain `failure()` no longer sees it -- every later step that
      #     cares whether the bump actually happened checks
      #     `steps.bump.outcome` explicitly instead, never should_release
      #     alone, since should_release only says a release was *wanted*).
      #   - on ANY failure path below, the working tree is reset back to
      #     the commit this step started from, so "Install dependencies"
      #     through "Publish release" -- the rolling build -- still run
      #     against real, unbumped source instead of a half-written
      #     package.json.
      #   - the job still has to end red when a release was due and didn't
      #     happen, or this whole gap goes unnoticed; see "Fail the job if
      #     a due release did not complete" at the very end of this file.
      #
      # What's gone for good: the branch-push retry/rebase loop and its
      # GH013 ruleset detection. There is no branch push any more, so
      # neither the race (main moving underneath this run) nor the ruleset
      # rejection it used to disambiguate can happen here at all -- that is
      # now entirely dead code, deleted rather than left disabled. The same
      # ruleset detection is kept below for the TAG push, though: tags live
      # under `refs/tags/*`, a separate namespace from the branch ruleset
      # that caused all this, but this repo demonstrably uses rulesets and
      # tag-protection rulesets are a real, separate GitHub feature -- so if
      # one fires on the tag push, the same clear diagnosis is worth having
      # rather than a raw git error.
      - name: Bump version and tag
        id: bump
        if: steps.release.outputs.should_release == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.release.outputs.version }}"

          # Snapshot HEAD before touching anything, so any failure below can
          # hand back a clean, unbumped tree. Nothing in this step commits
          # any more, so this is just for `restore_tree`'s `git reset --hard`
          # to have a well-named target -- it is never expected to differ
          # from HEAD's current value, but pinning it up front is cheap and
          # keeps restore_tree correct even if that ever changes.
          PRE_BUMP_HEAD=$(git rev-parse HEAD)

          restore_tree() {
            echo "Bump failed -- restoring the working tree to $PRE_BUMP_HEAD (pre-bump) so the build below runs from clean, unbumped source instead of a half-written package.json."
            # If this reset itself fails (disk/permissions weirdness, a
            # detached-HEAD edge case, ...) the tree is left exactly as
            # dangerous as this function exists to prevent -- a bumped
            # package.json -- and the build below would silently package a
            # version that was never released. There's nothing more we can
            # do about it from here, but at least say so loudly instead of
            # letting it pass unnoticed.
            git reset --hard "$PRE_BUMP_HEAD" || echo "::error::restore_tree failed -- the working tree may still be bumped. The build that follows this step may package an unreleased version."
          }

          # Safety net for any failure this script doesn't explicitly
          # handle below (the node script throwing, the tag push failing,
          # ...). Under `set -e`, any of those aborts the script anyway --
          # this just guarantees restore_tree still runs on the way out. It
          # does NOT fire for the explicit `exit 1` further down (bash does
          # not run ERR traps for an explicit `exit`), so that path calls
          # restore_tree itself before exiting.
          trap restore_tree ERR

          # package.json only -- .release-please-manifest.json is
          # deliberately NOT written here any more. That file used to be
          # bumped alongside package.json so the two would stay in
          # agreement once both were committed and pushed to main. With no
          # commit at all now, writing to it would be a pure no-op (it lives
          # only in this runner's throwaway working tree and is discarded
          # the moment the job ends) that would do nothing but confuse the
          # next person who finds a stale-looking edit to it in this
          # script's history.
          node -e "
            const fs = require('fs');

            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

          # No `git commit`, no `git push origin HEAD:main` -- see the big
          # comment above this step for why. The version bump above lives
          # only in this runner's working tree from here on; the build
          # steps below run against it directly, and it is discarded with
          # the runner afterwards.

          # Tag the commit being built (HEAD -- since nothing above ever
          # committed, this is still the exact merge commit "Checkout"
          # started from) so the tag itself becomes the durable version
          # record "Decide release" reads back on the next run.
          git tag "v$VERSION"

          # This tag push is now the ONLY push this step (or this workflow's
          # release path at all) makes to the remote -- there is no branch
          # push left to race or collide with. A rejection here still gets
          # the same ruleset-vs-something-else diagnosis the old branch push
          # had, for the same reason: tag-protection rulesets (e.g. a
          # "Restrict creations" rule on `v*`) are a real, separate GitHub
          # feature from the branch ruleset that caused all this, and this
          # repo demonstrably uses rulesets already. Without this, a GH013
          # here would fall straight into the generic `trap restore_tree
          # ERR` below with nothing but a raw git error -- exactly the
          # misleading-diagnosis problem this file has already been bitten
          # by once (see the branch-push history above). restore_tree still
          # resets this run's LOCAL tree back to pre-bump source either way,
          # so the rolling build below always runs from clean, unbumped
          # source regardless of why the tag push failed.
          TAG_PUSH_OUTPUT=$(git push origin "v$VERSION" 2>&1) || {
            echo "$TAG_PUSH_OUTPUT"
            if grep -qE 'GH013|push declined due to repository rule violations' <<<"$TAG_PUSH_OUTPUT"; then
              echo "GitHub's reported rule violation(s):"
              grep -E '^remote: -' <<<"$TAG_PUSH_OUTPUT" || true
              echo "::error::Push of tag v$VERSION was rejected by a repository ruleset (GH013). This is most likely a tag-protection ruleset (separate from the branch ruleset that governs main); check Settings > Rules > Rulesets for one covering tags and add github-actions to its bypass list if that's what the rule line above names. No tag means no versioned release can be published from this run."
            else
              echo "::error::Failed to push tag v$VERSION -- see the git output above for the actual cause. No tag means no versioned release can be published from this run."
            fi
            restore_tree
            exit 1
          }
          echo "$TAG_PUSH_OUTPUT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Fails loudly here rather than silently falling back at runtime.
      - name: Verify native module compiled
        shell: bash
        run: |
          set -e
          find node_modules/win-app-audio -name '*.node' -print
          test -f node_modules/win-app-audio/build/Release/win_app_audio.node
          # win-capture is the GPU-downscaled screen capture addon. Without
          # this check a build failure ships an app that looks fine and
          # silently falls back to Chromium capture at the old frame rate --
          # index.js is deliberately non-fatal on a missing binary, so nothing
          # else would ever complain.
          find node_modules/win-capture -name '*.node' -print
          test -f node_modules/win-capture/build/Release/win_capture.node

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Package
        run: pnpm package

      - name: Confirm addon shipped in the package
        shell: bash
        run: |
          echo "--- resources dir ---"
          find out -maxdepth 4 -name 'resources' -type d -exec ls -la {} \;
          echo "--- any win-app-audio on disk ---"
          find out -path '*win-app-audio*' -maxdepth 8 | head -20
          echo "--- unpacked natives ---"
          find out -name '*.node' | head -20
          echo "--- asar contents ---"
          ASAR=$(find out -name 'app.asar' -print -quit)
          if [ -n "$ASAR" ]; then
            npx --yes @electron/asar list "$ASAR" | grep -i -E 'win-app-audio|\.node' | head -20 || echo "(no matches inside asar)"
          fi
          echo "--- verdict ---"
          FAIL=0
          for N in win_app_audio win_capture; do
            if [ -n "$(find out -name "$N.node" -print -quit)" ]; then
              echo "OK: $N present"
            else
              echo "MISSING: $N not packaged"; FAIL=1
            fi
          done
          test "$FAIL" -eq 0

      # continue-on-error stays true for the rolling dev build -- a broken
      # `make` there just means today's win-per-app-audio asset doesn't
      # update, which is tolerable. On the release path it must fail loudly
      # instead: silently continuing past a failed `make` here would go on
      # to publish a real, non-prerelease release with missing or partial
      # Squirrel assets, which is exactly the bug this whole change exists
      # to prevent.
      #
      # Gated on steps.bump.outcome, not should_release: should_release only
      # says a release was wanted, not that the bump actually happened. If
      # "Bump version and tag" failed (a ruleset rejection on the tag push,
      # the version-writing node script throwing, ...) there is no versioned
      # release being attempted this run regardless of should_release --
      # "Verify Squirrel release assets exist" and "Publish versioned
      # release" below are both gated the same way and will not run -- so a
      # `make` hiccup here must stay tolerable, exactly like the
      # no-release-due case, instead of taking the rolling build down too.
      - name: Make installer
        run: pnpm make
        continue-on-error: ${{ steps.bump.outcome != 'success' }}

      # if: always() on this and the next two steps -- a release-worthy push
      # whose `make` fails now fails the job (continue-on-error is false
      # above), and by default GitHub Actions skips every later step without
      # its own `if:` once one has failed. Without always() here, that would
      # also take out today's win-per-app-audio rolling asset even though
      # nothing about the rolling build itself changed -- these three steps
      # still only ever act on whatever out/make actually contains.
      - name: Upload packaged app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoat-windows-per-app-audio
          path: |
            out/make/**/*
            out/*-win32-*/**
          if-no-files-found: warn
          retention-days: 14

      # Actions artifacts need a GitHub login to download, so publish the
      # installer as a release asset instead -- that is a plain public link.
      - name: Collect release assets
        id: assets
        if: always()
        shell: bash
        run: |
          mkdir -p release
          echo "--- what make produced ---"
          # `|| true` on every find below, same reasoning as "Verify Squirrel
          # release assets exist": under this shell's `-e`/pipefail defaults,
          # `find` on a missing directory (out/make not existing at all,
          # because `pnpm make` produced nothing) exits non-zero, which would
          # otherwise abort the step right here -- before the SETUP=/ZIP=
          # lookups and the PowerShell zip fallback below ever ran -- and take
          # the rolling win-per-app-audio asset down for a reason that has
          # nothing to do with it. This is more reachable now that "Make
          # installer" is strict (continue-on-error: false) on the release
          # path.
          find out/make -type f 2>/dev/null | head -30 || true

          SETUP=$(find out/make -name '*.exe' -print -quit 2>/dev/null || true)
          if [ -n "$SETUP" ]; then
            cp "$SETUP" "release/Stoat-per-app-audio-Setup.exe"
          fi

          ZIP=$(find out/make -name '*.zip' -print -quit 2>/dev/null || true)
          if [ -n "$ZIP" ]; then
            cp "$ZIP" "release/Stoat-per-app-audio-portable.zip"
          fi

          # Fall back to zipping the packaged folder if no maker produced one.
          if [ ! -f release/Stoat-per-app-audio-portable.zip ]; then
            APPDIR=$(find out -maxdepth 1 -type d -name '*-win32-*' -print -quit 2>/dev/null || true)
            if [ -n "$APPDIR" ]; then
              powershell -Command "Compress-Archive -Path '$APPDIR/*' -DestinationPath 'release/Stoat-per-app-audio-portable.zip' -Force"
            fi
          fi

          echo "--- release assets ---"
          ls -la release

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="win-per-app-audio"
          NOTES="Stoat for Desktop with per-application screen share audio on Windows.

          Sharing a **window** now sends only that application's sound instead of
          the entire system mix. Sharing a whole screen, or running a Windows
          build without process loopback support, falls back to the previous
          behaviour automatically.

          Built from branch \`feat/windows-per-app-audio\` (commit \`${GITHUB_SHA:0:7}\`).

          Diagnostics are written to \`%APPDATA%\Stoat\logs\app-audio.log\`.

          Unofficial build -- not affiliated with the Stoat project."

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY"               --title "Stoat: per-app screen share audio (Windows)"               --notes "$NOTES" --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          fi

          shopt -s nullglob
          FILES=(release/*)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            echo "no assets to upload"; exit 1
          fi

          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # Squirrel.Windows (MakerSquirrel here) does not poll the exe, GitHub's
      # "latest release" API, or anything update-electron-app-shaped -- it
      # downloads a plain-text RELEASES index (nupkg filename + SHA1 + size,
      # one line per version) and then the exact *-full.nupkg it names. Both
      # come out of `pnpm make` under out/make/squirrel.windows alongside the
      # Setup.exe, and the "Collect release assets" step above throws them
      # away -- it only globs for *.exe/*.zip for the rolling build. Skipping
      # this check would let a `make` that silently dropped the nupkg (or
      # produced RELEASES with no matching payload) through to a published
      # release that every installed app would fail to update from.
      #
      # `pnpm make` has never actually run to completion in CI before this
      # change (it's had continue-on-error: true since day one), so the most
      # likely first failure here is out/make/squirrel.windows not existing
      # at all. That path is checked explicitly, with its own message, and
      # every `find` below it is followed by `|| true`: under `set -e`,
      # `find` on a missing directory exits non-zero, and stderr is
      # discarded by the 2>/dev/null on the same line -- without `|| true`
      # the step would abort silently right there, before any of the
      # ::error:: messages below it ever had a chance to print, in exactly
      # the failure case this step exists to report clearly.
      # Gated on steps.bump.outcome == 'success', not should_release --
      # should_release only says a release was wanted; steps.bump.outcome
      # says whether the bump (writing the version and pushing its tag)
      # actually happened. A tag push rejected by a tag-protection ruleset,
      # or the version-writing node script throwing, leaves should_release
      # == 'true' with no real bump behind it, and there is nothing
      # versioned to verify in that case.
      - name: Verify Squirrel release assets exist
        if: steps.bump.outcome == 'success'
        shell: bash
        run: |
          set -e
          SQUIRREL_DIR="out/make/squirrel.windows"

          if [ ! -d "$SQUIRREL_DIR" ]; then
            echo "::error::$SQUIRREL_DIR does not exist -- 'pnpm make' did not produce a squirrel.windows output at all. Check the 'Make installer' step above."
            exit 1
          fi

          echo "--- squirrel.windows contents ---"
          find "$SQUIRREL_DIR" -type f

          RELEASES_FILE=$(find "$SQUIRREL_DIR" -name 'RELEASES' -print -quit 2>/dev/null || true)
          NUPKG_FILE=$(find "$SQUIRREL_DIR" -name '*-full.nupkg' -print -quit 2>/dev/null || true)
          SETUP_FILE=$(find "$SQUIRREL_DIR" -name '*.exe' -print -quit 2>/dev/null || true)

          if [ -z "$RELEASES_FILE" ]; then
            echo "::error::No RELEASES file under $SQUIRREL_DIR -- Squirrel has no update feed to read, so auto-update would silently never fire for anyone on this release. Check the 'Make installer' step above."
            exit 1
          fi

          if [ -z "$NUPKG_FILE" ]; then
            echo "::error::No *-full.nupkg under $SQUIRREL_DIR -- RELEASES would point at a payload that was never produced."
            exit 1
          fi

          if [ -z "$SETUP_FILE" ]; then
            echo "::error::No Setup.exe under $SQUIRREL_DIR -- nothing for a fresh install to download."
            exit 1
          fi

          echo "OK: $RELEASES_FILE"
          echo "OK: $NUPKG_FILE"
          echo "OK: $SETUP_FILE"

      # The real, semver-tagged, non-prerelease release. update.electronjs.org
      # (what update-electron-app's ElectronPublicUpdateService talks to)
      # only ever serves a repo's latest release that is BOTH semver-tagged
      # AND not marked prerelease -- it is the sole thing this repo publishes
      # that the auto-updater can see at all. win-per-app-audio above is a
      # prerelease on a fixed tag on purpose, so it stays invisible to it.
      #
      # Ship the entire out/make/squirrel.windows output verbatim, under its
      # own filenames -- Squirrel resolves the .nupkg it needs by the exact
      # name written inside RELEASES, so renaming (like the rolling build
      # does above for its own assets) would break the update.
      #
      # Created as a draft first, on purpose: gh release create without
      # --draft makes the release live (and visible to update.electronjs.org)
      # immediately, before a single asset is attached. A client polling in
      # that window would see RELEASES pointing at a .nupkg that doesn't
      # exist yet -- a 404 the update service then caches -- and if the
      # upload step failed partway through, that broken, half-published
      # state would be permanent even though the job itself goes red. Upload
      # everything first, then flip it to public in one step at the end.
      # Same reasoning as "Verify Squirrel release assets exist" above:
      # gated on the bump having actually succeeded, not merely on a
      # release having been wanted.
      - name: Publish versioned release
        if: steps.bump.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.release.outputs.version }}"
          BUMP="${{ steps.release.outputs.bump }}"
          TAG="v$VERSION"

          # Guard against silently clobbering an already-published release.
          # Verified: pushing a tag that already exists on the remote AT THE
          # SAME COMMIT (the concurrent-runs case the "concurrency" block at
          # the top of this file exists to avoid) gives `git push` a plain
          # "Everything up-to-date", exit 0 -- not a rejection -- so a run
          # that reaches here for a version that was already shipped would
          # otherwise fall into the "already exists" branch below and `gh
          # release upload --clobber` over a release real users may already
          # be running, with no warning at all. A DRAFT release for this tag
          # is the expected "retry after a previous partial failure" case
          # handled below and is safe to keep uploading into; a non-draft
          # (already public) release for this tag is not -- that only
          # happens if this version genuinely shipped already.
          EXISTING_IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")
          if [ "$EXISTING_IS_DRAFT" = "false" ]; then
            echo "::error::A published (non-draft) release already exists for $TAG. Continuing would re-upload --clobber over it. This is most likely two runs computing the same next version (see the 'concurrency' comment at the top of this file), not a problem with this run's own build -- investigate before deleting anything."
            exit 1
          fi

          shopt -s globstar nullglob
          ASSETS=()
          for f in out/make/squirrel.windows/**; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No files found under out/make/squirrel.windows to publish."
            exit 1
          fi

          echo "--- assets to publish ---"
          printf '%s\n' "${ASSETS[@]}"

          NOTES="Automated release from \`main\` (bump: $BUMP).

          Commit: \`$(git rev-parse --short HEAD)\`"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY"               --title "Stoat for Desktop v$VERSION"               --notes "$NOTES" --draft
          else
            # Re-run after a previous partial failure -- the release (still a
            # draft at this point) already exists, just refresh its notes.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"

          # Every asset is confirmed uploaded -- safe to make it a real,
          # public, non-prerelease release now.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # If anything from "Bump version and tag" onward fails after the tag
      # itself has already been pushed (Package/Make/Verify Squirrel/Publish
      # versioned release failing), there is now a real `v<version>` tag on
      # the repo with no GitHub release behind it -- and, unlike the old
      # push-to-main design, there is no bump commit anywhere to also worry
      # about cleaning up: nothing was ever committed, so main is completely
      # untouched by a failure here. Deleting the tag means there is never a
      # v<version> tag on the repo without a matching GitHub release next to
      # it, and the failure stays visible instead of silently leaving a
      # dangling tag around -- one that "Decide release" would otherwise
      # treat as "the most recent v* tag" on the very next run and compute
      # the following version from, as if this version had actually shipped.
      #
      # Gated on should_release (a release was wanted at all) AND
      # steps.bump.outcome != 'success' OR failure() -- not, as it might
      # look, redundant with steps.bump.outcome == 'success'.
      #
      # The first cut of this condition after the continue-on-error
      # restructure was `failure() && steps.bump.outcome == 'success'`,
      # reasoned as: "Bump version and tag" now runs with
      # continue-on-error: true, so its own failure no longer trips plain
      # failure() (steps.bump.conclusion is forced to 'success' even when
      # steps.bump.outcome is 'failure') -- fine, because a failed bump
      # restores the tree before it ever gets to `git tag`, so there's
      # nothing to clean up. That reasoning has a hole: it assumed the tag
      # is created atomically with the rest of the step succeeding, but
      # `git tag` and its push both run *inside* the same step, before the
      # step's own exit code is known. A tag push that half-lands --
      # accepted by the remote but git still exits non-zero (a hook, a
      # proxy hiccup, the runner being cancelled between the two commands)
      # -- leaves a real tag on origin while steps.bump.outcome is
      # 'failure', which the old condition would skip entirely. A stray
      # `v<version>` tag with no release is worse than it sounds: it
      # becomes "the most recent v* tag" for the *next* run's "Decide
      # release" step, which can compute BUMP=none against it and skip a
      # release that was actually due, with nothing on GitHub or the
      # updater to show for the version that tag claims.
      #
      # So: run whenever a release was wanted and the bump did NOT cleanly
      # succeed (covers the half-landed-tag case above, belt-and-suspenders
      # even though "Bump version and tag" tries to avoid it) OR
      # something later genuinely failed (covers the original "bump
      # succeeded, Package/Make/Verify Squirrel/Publish versioned release
      # failed" case). `!cancelled()` rather than `always()` -- a manually
      # cancelled run shouldn't have this run a cleanup implying something
      # was wrong with the release logic itself. The tag-deletion push
      # itself stays a no-op (falls into its own `|| echo`) whenever there
      # was no tag to delete, so running this a little more often than
      # strictly necessary is harmless.
      - name: Clean up unreleased tag on failure
        if: "!cancelled() && steps.release.outputs.should_release == 'true' && (failure() || steps.bump.outcome != 'success')"
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          git push origin ":refs/tags/v$VERSION" || echo "tag v$VERSION was not pushed, or is already gone"

      # Everything above this point -- including the rolling win-per-app-
      # audio build and its own prerelease publish -- is now allowed to
      # succeed even when the versioned release did not happen; that is the
      # entire point of the continue-on-error / restore_tree restructure on
      # "Bump version and tag" (and, for the same reason, on
      # "Decide release") above. But a release that was due and silently
      # didn't happen must not be allowed to look like an ordinary green
      # run, or nobody will notice the ruleset bypass-list gap (or whatever
      # else broke) until someone goes looking for a release that was never
      # published. So: fail the job here -- deliberately the very last
      # step, with `!cancelled()` (not `always()`, so a manually cancelled
      # run doesn't get an extra misleading "release did not complete"
      # error alongside the cancellation) so every rolling-build step above
      # it has already had its chance to run and publish first -- when
      # either of two things happened:
      #   - "Decide release" itself failed (steps.release.outcome ==
      #     'failure'). Its own should_release output was then never
      #     written at all, so this is checked directly rather than via
      #     should_release, which would otherwise read as empty/false and
      #     let the run end green with no release and no explanation.
      #   - "Decide release" succeeded, did decide a release was due
      #     (should_release == 'true'), but the bump did not actually
      #     succeed (steps.bump.outcome != 'success') -- a ruleset
      #     rejection on the tag push, or a half-landed tag push, all
      #     covered above.
      - name: Fail the job if a due release did not complete
        if: "!cancelled() && (steps.release.outcome == 'failure' || (steps.release.outputs.should_release == 'true' && steps.bump.outcome != 'success'))"
        shell: bash
        run: |
          if [ "${{ steps.release.outcome }}" = "failure" ]; then
            echo "::error::The 'Decide release' step failed, so it's unknown whether a release was even due on this push -- see that step's log above for the actual cause. The rolling win-per-app-audio pre-release was still rebuilt and republished from unbumped source; only the versioned release path is affected."
          else
            echo "::error::A ${{ steps.release.outputs.bump }} release (v${{ steps.release.outputs.version }}) was due on this push but did not happen -- see the 'Bump version and tag' step above for the actual cause. The rolling win-per-app-audio pre-release was still rebuilt and republished from unbumped source; only the versioned release is missing."
          fi
          exit 1
