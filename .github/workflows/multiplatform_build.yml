name: Multiplatform Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/build.yml"
      - ".vscode/**"
      - ".gitignore"
      - "README.md"
  pull_request:

jobs:
  build:
    name: Build App
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # windows-latest ships Visual Studio 18, which node-gyp cannot detect,
        # so every native module (win-app-audio, register-scheme) fails to
        # build and takes the whole job with it. win-app-audio.yml already
        # pins windows-2022 for exactly this reason.
        os: [windows-2022, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci -F stoat-desktop

      - name: Build
        run: pnpm package