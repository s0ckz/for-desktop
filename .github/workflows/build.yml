name: Build & Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/build.yml"
      - ".vscode/**"
      - ".gitignore"
      - "README.md"
  pull_request:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@7b8610a904d57da241e4ddba17fa62b62b15aed4 # use-mise-action-v2.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout assets
        run: mise assets

      - name: Install dependencies
        run: mise install:frozen

      - name: Lint
        run: mise lint

      - name: Native session interval policy contracts
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic native/win-capture/test-session-interval.cc -o "$RUNNER_TEMP/session-interval-test"
          "$RUNNER_TEMP/session-interval-test"

      - name: Local screen share diagnostic contracts
        run: mise exec -- node --test tools/screen-share-diagnostic/diagnostic.test.cjs

      - name: Native renderer lifecycle and flow trace contracts
        run: mise exec -- node --test src/native/screenCapture.hardening.test.cjs

      - name: Format local diagnostic
        run: mise exec -- pnpm exec prettier --check tools/screen-share-diagnostic/

      - name: Format
        run: mise format

      - name: Build
        run: mise build
